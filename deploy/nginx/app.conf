# ============================================================
# Reverse proxy inside the frontend container.
# Serves SPA + proxies /api/, /admin/, /static/, /media/ → backend.
# TLS termination happens one layer up (host nginx + certbot), see
# deploy/nginx/host.conf.example.
# ============================================================

upstream brendor_backend {
    server backend:8000;
    keepalive 32;
}

# OSM tile proxy cache — mijoz brauzeri /osm/... orqali so'raydi,
# nginx tile.openstreetmap.org'dan yuklaydi va 30 kun cache qiladi.
# Bu usul OSM'ning region-based 403 bloklariga qarshi ishlaydi.
proxy_cache_path /var/cache/nginx/osm levels=1:2 keys_zone=osm_cache:10m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;

    # OSM tile proxy
    location ~ ^/osm/(?<z>[0-9]+)/(?<x>[0-9]+)/(?<y>[0-9]+)\.png$ {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        proxy_cache osm_cache;
        proxy_cache_valid 200 302 30d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Osm-Cache $upstream_cache_status;
        proxy_set_header User-Agent "Brendor-ERP/1.0 (+https://cleanlife.uz)";
        proxy_set_header Accept "image/png,image/*;q=0.8,*/*;q=0.5";
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_pass https://tile.openstreetmap.org/$z/$x/$y.png;
    }

    client_max_body_size 25m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    # NOTE: tighten CSP after wiring your real asset origins (face-api CDN, OSM tiles, etc.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: ; style-src 'self' 'unsafe-inline' https: ; font-src 'self' data: https: ; img-src 'self' data: blob: https: http: ; connect-src 'self' https: wss: ; media-src 'self' blob: data: ; worker-src 'self' blob: ; frame-ancestors 'none'; base-uri 'self';" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ---
    location /api/ {
        proxy_pass http://brendor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # --- Django admin ---
    location /admin/ {
        proxy_pass http://brendor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # --- Django static (whitenoise) + media ---
    location /static/ { proxy_pass http://brendor_backend; }
    location /media/  { proxy_pass http://brendor_backend; }

    # --- SPA ---
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
